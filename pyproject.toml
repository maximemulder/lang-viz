[project]
name = "language-atlas-pipeline"
version = "0.1.0"
description = "Offline data preparation for the interactive language atlas"
requires-python = ">=3.12"
dependencies = [
  "polars>=1.35.0",
  "pyshp==3.1.6",
  "numpy==2.5.4",
  "shapely==2.2.0",
  "mapbox-vector-tile==2.2.0",
  "pyproj==3.8.0",
]

[dependency-groups]
dev = [
  "pyrefly==1.4.1",
  "pytest>=8.4.0",
  "ruff>=0.14.0",
  "types-shapely==2.1.0.20261030",
]

[tool.ruff]
line-length = 100
target-version = "py312"
include = ["pipeline/**/*.py", "app/tests/browser/**/*.py", "app/scripts/**/*.py"]

[tool.ruff.lint]
# This workspace mount reports tracked 644 Python files as executable (777).
ignore = ["EXE002"]

[tool.pyrefly]
python-version = "3.12"
project-includes = ["pipeline/**/*.py", "app/tests/browser/**/*.py", "app/scripts/**/*.py"]
search-path = [
  "app",
]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests", "app/tests/browser"]
pythonpath = ["."]
